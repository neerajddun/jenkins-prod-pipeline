apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: neeraj91/prometheus-app
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "150Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: myapp-svc
  labels:
    job: node-api
    app: myapp
spec:
  type: ClusterIP
  selector:
    app: myapp
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: web
