apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: myapp-monitor
  namespace: default
  labels:
    release: monitoring
    app: monitoring
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: myapp # must match your Service's labels
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: web # must match the named port in your Service
      path: /metrics
      interval: 30s
